services:
  - type: web
    name: planning-poker-api
    env: go
    buildCommand: go build -o bin/server .
    startCommand: ./bin/server
    plan: free
    envVars:
      - key: PORT
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: JIRA_CLIENT_ID
        sync: false
      - key: JIRA_CLIENT_SECRET
        sync: false
