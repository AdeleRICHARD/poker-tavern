services:
  - type: web
    name: planning-poker-api
    env: go
    buildCommand: go build -o main .
    startCommand: ./main
    plan: free
    buildFilter:
      paths:
      - main.go
      - go.mod
      - go.sum
      ignoredPaths: []
    rootDir: .
    envVars:
      - key: PORT
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: JIRA_CLIENT_ID
        sync: false
      - key: JIRA_CLIENT_SECRET
        sync: false
